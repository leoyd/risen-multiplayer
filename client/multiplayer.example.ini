; Config de Risen Multiplayer — à copier en `multiplayer.ini` dans <Risen>/bin/scripts/,
; à côté de Script_Multiplayer.dll.
; Format : `cle = valeur`, une par ligne. Commentaires : `;` ou `#` en début de ligne
; uniquement — un commentaire en fin de ligne ferait partie de la valeur.
; Config absente ou invalide : le mod reste inactif et le jeu fonctionne en solo
; (la raison est écrite dans Script_Multiplayer.log).

; host (hôte : fait tourner le serveur) ou guest (invité). Obligatoire.
role = host

; Adresse IPv4 de l'hôte (ex. 192.168.1.20). Obligatoire pour un invité, ignorée pour l'hôte.
; Ni nom d'hôte ni IPv6 : la session ne démarre pas (« IPv4 attendue » au log).
host_ip = 192.168.1.20

; Port UDP de la session, entre 1 et 65535. Vide ou absent : 27960.
; Hôte : port d'écoute, à ouvrir dans le pare-feu et à rediriger sur la box (UDP) si
; l'invité vient d'Internet. Invité : port de l'hôte à joindre ; l'invité lui-même
; utilise un port local éphémère (rien à ouvrir de son côté).
port = 27960

; Pseudo affiché, 1 à 32 octets (UTF-8 : un caractère accentué compte pour 2). Défaut : Joueur.
nickname = Joueur

; Équipement de l'invité (validé au chargement dans les deux rôles, appliqué en invité
; seulement) : noms de templates du jeu séparés par des virgules, espaces tolérés autour de
; chaque nom. Un nom : 1 à 64 caractères
; A-Z, a-z, 0-9 ou _ ; 16 noms au plus, sans doublon, 255 octets au plus sans les espaces.
; À chaque entrée en session, chaque objet est créé dans l'inventaire du héros s'il y manque,
; puis équipé ; l'hôte équipe de même l'avatar de l'invité. Un nom inconnu du jeu est
; journalisé et ignoré. Une valeur mal formée empêche le chargement de la config, même en hôte.
; Exemple : guest_equipment = It_Armor_Don_Fighter, It_1H_Sword_Rusty
; Vide ou absent : aucun équipement (défaut).
guest_equipment =

; Mode sonde du spike J1 (rétro-ingénierie) : 1 = installe les hooks OnProcess et
; PlayMotion, journalise un tick par seconde et les animations du joueur ;
; F6 fait apparaître une copie du joueur, F7 lui fait rejouer la dernière animation.
; Spike J2 : pavé numérique Num1 à Num6 (Verr. Num actif), hooks supplémentaires Kill et
; gCScriptRoutine_PS::OnProcess ; protocole dans docs/re/spike-j2.md.
; Avec la sonde, aucune session n'est lancée.
; 0, vide ou absent : session multijoueur (hook OnProcess seul) (défaut : 0).
probe = 0

; Niveau du log : info (défaut) ou debug. Insensible à la casse. Vide ou absent : info.
; En debug : empreintes locales, Hello envoyés, heartbeats reçus, datagrammes ignorés.
log_level = info
