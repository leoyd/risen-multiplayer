; Config de Risen Multiplayer — à copier en `multiplayer.ini` dans <Risen>/bin/scripts/,
; à côté de Script_Multiplayer.dll.
; Format : `cle = valeur`, une par ligne. Commentaires : `;` ou `#` en début de ligne
; uniquement — un commentaire en fin de ligne ferait partie de la valeur.
; Config absente ou invalide : le mod reste inactif et le jeu fonctionne en solo
; (la raison est écrite dans Script_Multiplayer.log).

; host (hôte : fait tourner le serveur) ou guest (invité). Obligatoire.
role = host

; IP ou nom de l'hôte. Obligatoire pour un invité, ignoré pour l'hôte.
host_ip = 192.168.1.20

; Port UDP du serveur, entre 1 et 65535. Vide ou absent : 27960.
port = 27960

; Pseudo affiché, 1 à 32 octets (UTF-8 : un caractère accentué compte pour 2). Défaut : Joueur.
nickname = Joueur

; Équipement de départ de l'invité (utilisé à partir de J1).
guest_equipment =

; Mode sonde du spike J1 (rétro-ingénierie) : 1 = installe les hooks OnProcess et
; PlayMotion, journalise un tick par seconde et les animations du joueur ;
; F9 fait apparaître une copie du joueur, F10 lui fait rejouer la dernière animation.
; 0, vide ou absent : aucun hook (défaut : 0).
probe = 0
